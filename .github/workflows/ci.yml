# CI for skillmap. Jobs join this workflow as their task lands (docs/00-tasks.md).
#
# What these jobs guard:
#
#   spec           - invariant 2  (canonical, sortable, schema-conformant manifest shape)
#                     invariant 3  (unresolved vs. diagnostics stay two closed, non-overlapping enums)
#                     invariant 4  (proven/pattern evidence is complete-or-rejected by the schema)
#                     invariant 5  (the three assurance tiers never blend — advisory's
#                                   evidence type structurally cannot carry rule_id/snippet_sha256)
#                     invariant 6  (advisory.enabled pins model + prompt_sha256, or carries neither)
#                     invariant 12 (every prose-referenced path either exists or is a documented,
#                                   allowlisted gap — no aspirational references left unverified)
#                    It also owns the schema half of the type/schema drift gate: the golden
#                    manifest the Rust types render must still validate against the schema.
#   rust           - invariant 11 (the eval gate: a failing adversarial case, shrinking
#                                   coverage, or a case regressing to pending fails the build)
#                     invariant 2  (the 1,000-shuffle determinism suite), run on ubuntu AND
#                                   windows because "byte-identical on any machine" is the
#                                   claim, and a one-platform run does not test it
#                     invariant 10 (clippy denies unwrap/expect/panic/indexing in library
#                                   crates; -D warnings makes that a failure, not a note)
#                    It also owns the types half of the drift gate: `--test golden` fails if
#                    the canonical rendering changed without being re-blessed.
#   line-endings   - invariant 2  (byte-identical hashing breaks the moment a fixture is
#                                   checked out with CRLF; run on windows-latest specifically
#                                   because that is the one platform where it can happen)
#   toolchain-pin  - invariant 9  (reproducible builds require an exact, non-floating
#                                   Rust channel — this guards the promise before any
#                                   code exists to build)
#   supply-chain   - invariant 9  (SECURITY.md promises a minimal dependency tree where
#                                   "every dependency is one this project would have to
#                                   defend in the threat model". deny.toml has existed
#                                   since T0 with nothing running it, which made that
#                                   promise aspirational — a supply-chain auditor with an
#                                   ungated supply chain is the failure this project
#                                   exists to describe in other people's repositories.)
#
# The `rust` job also runs `skillmap ci` against this repository's own two skills,
# with the committed skillmap.lock and policy.toml. A tool that gates other
# people's repositories and not its own is making a claim it has not tested.

name: CI

on:
  push:
  pull_request:

jobs:
  spec:
    name: spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema pyyaml

      - name: Run spec verifier
        run: python scripts/verify_spec.py

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel the sibling platform on first failure: when determinism
      # breaks, "which platform disagreed" is the whole diagnostic, and a
      # cancelled matrix leg throws that away.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Before checkout, for the same reason as the line-endings job: the Windows
      # runner's default autocrlf=true would rewrite the golden manifest's LF
      # endings on the way in, and the golden test would fail on the checkout
      # rather than on anything this repository actually got wrong.
      - name: Disable line-ending rewriting on checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # No toolchain is named here on purpose. rust-toolchain.toml pins the exact
      # version (invariant 9) and rustup honours it automatically; naming one here
      # too would create a second source of truth that drifts from the first.
      - name: Show toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The semantic pass's HTTP provider is behind a non-default feature, so the
      # default build above never compiles it — and code nothing compiles rots.
      # This only builds it; it makes no call, because a CI job that hit a model
      # API would be neither offline (invariant 9) nor deterministic.
      - name: Clippy (semantic provider compiled in)
        run: cargo clippy -p skillmap-cli --all-targets --features anthropic -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Doc tests
        run: cargo test --workspace --doc

      # Invariant 11: eval is CI-gated. The harness exits non-zero on a failing
      # case, on coverage shrinking, and on a case falling back to pending —
      # the last two matter because both make the suite *greener* while checking
      # less. Runs on both platforms because a rule that fires differently on
      # Windows is a rule that is not deterministic.
      - name: Eval gate
        run: cargo run -p skillmap-eval

      # Dogfooding, and the only honest way to claim the check works. This
      # repository ships two skills of its own; `skillmap ci` runs against them
      # with the committed skillmap.lock and policy.toml, and a change to either
      # skill that adds capability fails this build the same way it would fail
      # anyone else's. The T8 acceptance fixtures are covered by
      # `cargo test -p skillmap-cli` above; this covers the real thing.
      - name: skillmap ci (on skillmap)
        run: cargo run -p skillmap-cli -- ci

  line-endings:
    name: line-endings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Must happen before checkout: otherwise the Windows runner's default
      # autocrlf=true rewrites LF to CRLF on the way into the working tree,
      # and this job ends up testing git's checkout behaviour instead of
      # whether the repository's own tracked bytes are LF.
      - name: Disable line-ending rewriting on checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: --only line-endings uses nothing but the standard library
      # and git. Installing jsonschema here would be a dependency this job never
      # touches.
      - name: Verify no tracked text file contains CRLF
        run: python scripts/verify_spec.py --only line-endings

  # The release path is shell, and shell fails at runtime. Two bugs in
  # scripts/homebrew-formula.sh were found by running it rather than reading it —
  # one of them emitted a complete, publishable formula with four empty sha256
  # fields and exited 0. `bash -n` would not have caught that one, but it catches
  # the class that turns a tagged release into a broken one at the worst moment,
  # and it costs a second. The behavioural checks live in .github/workflows/release.yml,
  # which runs the real thing before anything is published.
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check every shell script
        run: |
          found=0
          for script in scripts/*.sh; do
            found=1
            echo "checking $script"
            bash -n "$script"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no shell scripts found; this job is checking nothing"
            exit 1
          fi

      # No shellcheck step yet, deliberately. It is preinstalled on this runner
      # and would be a better gate than `bash -n`, but it could not be run before
      # being committed here, and adding a gate whose first execution is on
      # somebody else's push is how a repository acquires a red build it did not
      # author. In docs/00-tasks.md's Known gaps.

  toolchain-pin:
    name: toolchain-pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert rust-toolchain.toml pins an exact version
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path("rust-toolchain.toml")
          if not path.is_file():
              print("rust-toolchain.toml is missing")
              sys.exit(1)

          text = path.read_text(encoding="utf-8")
          match = re.search(r'channel\s*=\s*"([^"]+)"', text)
          if not match:
              print("rust-toolchain.toml has no [toolchain] channel field")
              sys.exit(1)

          channel = match.group(1)
          if channel in {"stable", "beta", "nightly"} or not re.fullmatch(r"\d+\.\d+\.\d+", channel):
              print(f"rust-toolchain.toml channel is not pinned to an exact version: {channel!r}")
              sys.exit(1)

          print(f"rust-toolchain.toml pins channel = {channel}")
          PY

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to a released action rather than `cargo install cargo-deny`: this
      # job's whole subject is not trusting unpinned dependencies, and building
      # the auditor from an unlocked source would undercut the point of running
      # it. The action ships a prebuilt binary at a tagged version.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # All four checks. `bans` and `sources` matter as much as `advisories`
          # here: a duplicate version doubles the code to defend, and a git
          # dependency is a dependency with no immutable artifact behind it.
          command: check advisories bans licenses sources
