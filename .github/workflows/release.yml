# Release: build every platform reproducibly, prove it, then publish.
#
# The order of the jobs is the argument. `reproducible` runs before anything is
# published and builds the same tag twice from two different directories on the
# same runner; if the two binaries differ, nothing ships. That is T9's acceptance
# criterion — *"two builds of the same tag from clean checkouts are
# byte-identical"* — enforced rather than asserted.
#
# What that check is actually worth: it proves the build does not depend on where
# it happened, which is what makes a third party's rebuild meaningful evidence.
# Without it, "reproducible" is a word in a README, and the attestation below
# only proves that *this* workflow produced these bytes, not that anybody else
# could produce them too.
#
# Signing is GitHub's build provenance attestation (sigstore-backed, keyless).
# Deliberately not a long-lived signing key: a key this project would have to
# store, rotate, and eventually lose is a worse story than an attestation tied to
# the workflow identity that can be verified with `gh attestation verify`.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (dry run; publishes nothing)
        required: true

permissions:
  contents: read

jobs:
  reproducible:
    name: reproducible (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both linkers this project ships through. The MSVC one is the reason
        # scripts/build-release.sh passes /Brepro at all: the first two builds of
        # this repository differed in exactly the 24 bytes of the PE header's
        # TimeDateStamp.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Disable line-ending rewriting on checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          path: build-one

      # A second checkout at a different path, which is the whole point. Building
      # twice in the same directory proves almost nothing; the failure mode being
      # tested is an absolute path baked into the output.
      - uses: actions/checkout@v4
        with:
          path: build-two-at-a-different-path

      - name: Show toolchain
        run: rustup show active-toolchain

      - name: Build once
        shell: bash
        working-directory: build-one
        run: bash scripts/build-release.sh

      - name: Build again, elsewhere
        shell: bash
        working-directory: build-two-at-a-different-path
        run: bash scripts/build-release.sh

      - name: Compare
        shell: bash
        run: |
          one=$(find build-one/dist -type f | head -1)
          two=$(find build-two-at-a-different-path/dist -type f | head -1)
          echo "one: $(sha256sum "$one")"
          echo "two: $(sha256sum "$two")"
          if ! cmp -s "$one" "$two"; then
            echo "::error::builds from two directories are not byte-identical"
            cmp -l "$one" "$two" | head -40
            exit 1
          fi
          echo "byte-identical"

  build:
    name: build (${{ matrix.target }})
    needs: reproducible
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners rather than cross-compilation. A cross-built binary
          # cannot be smoke-tested by the job that produced it, and "it links"
          # is not the same claim as "it runs".
          - { target: linux-x64,    runner: ubuntu-latest,    binary: skillmap }
          - { target: linux-arm64,  runner: ubuntu-24.04-arm, binary: skillmap }
          # `macos-13` until it was retired in December 2025. The label did not
          # start erroring — jobs targeting it simply queue forever, so
          # `build (darwin-x64)` sat unallocated for twelve hours on v0.4.0 and
          # `publish` never ran. A dead runner label fails silently, which is
          # worse than failing loudly.
          #
          # `macos-15-intel` is GitHub's migration target and the LAST Intel
          # image: x86_64 macOS runners disappear entirely in Fall 2027. When
          # they do, this row either goes away or starts cross-compiling, and
          # cross-compiling costs the smoke test below — which is the check that
          # would catch a release shipping an empty ruleset.
          - { target: darwin-x64,   runner: macos-15-intel,   binary: skillmap }
          - { target: darwin-arm64, runner: macos-14,         binary: skillmap }
          - { target: win32-x64,    runner: windows-latest,   binary: skillmap.exe }
    steps:
      - name: Disable line-ending rewriting on checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: bash scripts/build-release.sh

      # The binary carries its own rules (crates/skillmap-rules/build.rs), so
      # this is a real end-to-end check and not a version banner: it scans a
      # fixture project and must find the credential read. A release that shipped
      # an empty ruleset would pass every other check in this file and report
      # every project in the world clean.
      - name: Smoke test
        shell: bash
        run: |
          ./dist/${{ matrix.binary }} version
          ./dist/${{ matrix.binary }} rules
          ./dist/${{ matrix.binary }} scan --project fixtures/projects/v1.1 > scanned.json
          grep -q 'fs.read.credential' scanned.json
          grep -q 'py.credential-read.dotfile' scanned.json
          echo "the shipped binary detects with its own embedded rules"

      - uses: actions/upload-artifact@v4
        with:
          name: skillmap-${{ matrix.target }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # download-artifact names each directory after the artifact; the npm
      # packager wants them named by target.
      - name: Arrange artifacts
        run: |
          mkdir -p dist
          for dir in artifacts/skillmap-*; do
            target="${dir#artifacts/skillmap-}"
            mkdir -p "dist/$target"
            cp "$dir"/* "dist/$target/"
          done
          find dist -type f | sort

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The tag and the crate version must agree, or `cargo install` and the
          # npm package would ship different numbers for the same bytes.
          crate=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$version" != "$crate" ]; then
            echo "::error::tag says $version, Cargo.toml says $crate"
            exit 1
          fi

      - name: Package archives and checksums
        run: |
          mkdir -p release
          cd dist
          for target in *; do
            if [ "$target" = "win32-x64" ]; then
              (cd "$target" && zip -q "../../release/skillmap-$target.zip" skillmap.exe)
            else
              chmod +x "$target/skillmap"
              tar -czf "../release/skillmap-$target.tar.gz" -C "$target" skillmap
            fi
          done
          cd ../release
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      # Attests the archives, which are what people download. Verify with:
      #   gh attestation verify skillmap-linux-x64.tar.gz --repo TakasiVenkataSandeep-08/agentskillmap
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/skillmap-*

      - name: Build npm packages
        run: bash scripts/npm-packages.sh "${{ steps.version.outputs.version }}" dist npm-dist

      # Generated from the checksums that were actually published, because a
      # formula with a stale sha256 fails at install time with a hash mismatch —
      # which reads to a user exactly like a compromised download. Attached to
      # the release as well as pushed to the tap below, so the bytes brew will
      # fetch are also downloadable and checkable by hand.
      - name: Generate the Homebrew formula
        run: bash scripts/homebrew-formula.sh "${{ steps.version.outputs.version }}" release > release/skillmap.rb

      # Re-runnable. `gh release create` errors when the release already exists,
      # which made re-running this job impossible — and re-running this job is
      # the recovery path when a later step fails, so the recovery was broken by
      # the step that had already succeeded.
      #
      # The tap and the Action-tag steps were already safe to repeat. This one
      # and npm were not, and both are fixed here rather than one.
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME exists; replacing its assets rather than failing"
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --generate-notes
          fi

      # Without this the tap keeps serving the previous version: the formula is
      # regenerated with fresh checksums every release, and nothing copies it
      # across. That was manual, documented, and exactly the kind of step that
      # gets skipped once and then disbelieved.
      #
      # It needs a token for a DIFFERENT repository. `github.token` is scoped to
      # this one, so a fine-grained PAT with Contents:write on
      # homebrew-agentskillmap goes in HOMEBREW_TAP_TOKEN. Absent, this skips
      # loudly rather than failing the release — the same shape as the npm step,
      # because a release that shipped binaries should not be marked failed for
      # want of a convenience.
      #
      # Ordered before npm deliberately. A tap push is a git commit and can be
      # reverted; an npm publish cannot be unpublished after 72 hours, so the
      # irreversible step stays last.
      - name: Update the Homebrew tap
        if: github.event_name == 'push'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap update. \`brew install\` will keep serving the previous version until the formula is copied across by hand."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/${{ github.repository_owner }}/homebrew-agentskillmap.git" tap
          mkdir -p tap/Formula
          cp release/skillmap.rb tap/Formula/skillmap.rb
          cd tap
          if git diff --quiet -- Formula/skillmap.rb; then
            echo "::notice::the formula is byte-identical to the one already in the tap; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/skillmap.rb
          git commit -m "skillmap $VERSION

          Generated by scripts/homebrew-formula.sh from the checksums published
          with the $VERSION release. Do not edit by hand."
          git push

      # The README advertises `uses: …/agentskillmap@v1`, which resolves through
      # a moving major tag that nothing was moving. Same convention as
      # actions/checkout: v1 follows the newest 0.x/1.x release so a consumer
      # pinning @v1 gets fixes without editing their workflow.
      #
      # Force-updating a tag is deliberate here and is the only place this
      # repository does it.
      - name: Move the major Action tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1 "$GITHUB_REF_NAME"
          git push -f origin v1
          echo "::notice::v1 now points at $GITHUB_REF_NAME"

      # Publishing is last and gated on everything above. npm has no unpublish
      # after 72 hours, so a bad publish is permanent in a way a bad GitHub
      # release is not — it goes after the release, not before it.
      # Pinned rather than inherited. `--provenance` needs npm 9.5 or newer, and
      # without this step npm is whatever the runner image happens to ship — it
      # worked on the first attempt by luck, not by contract, and a runner image
      # is free to move underneath a release.
      #
      # Deliberately no `registry-url`: that makes setup-node write its own
      # .npmrc keyed on NODE_AUTH_TOKEN, and the hand-written one below is the
      # path that demonstrably authenticated. Pin the toolchain, leave the auth
      # alone.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish to npm
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Explicit rather than inherited. The runner's default for a `run:`
          # block already aborts on error, but this step publishes to a registry
          # with no unpublish after 72 hours — "which shell flags did the runner
          # pick today" is not a question worth having an answer to here. With
          # this, a failed package stops the loop instead of the next one being
          # attempted against a registry that just rejected the last.
          set -euo pipefail

          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set; skipping npm publish"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > ~/.npmrc
          echo "npm $(npm --version), node $(node --version)"

          # E404 on a scoped PUT does not mean what it says. npm returns 404
          # rather than 403 for a scope you cannot write to, so it does not leak
          # whether a scope exists — which reads as "your package is missing"
          # when it means "your scope is". That cost a release to diagnose; the
          # message now says so at the point of failure.
          # Keyed on the error code npm actually returned, not on the package
          # name. The first version of this keyed on the name and so explained
          # E404 during an EOTP failure — a confidently wrong diagnosis, which is
          # worse than none.
          publish() {
            local log name version
            name="$(node -p "require('./$1/package.json').name")"
            version="$(node -p "require('./$1/package.json').version")"

            # npm forbids republishing a version, so a re-run after a partial
            # publish would fail on the packages that already landed — the loop
            # publishes platform packages one at a time and any of them can be
            # the one that broke. Skipping what is already on the registry is
            # what makes retrying this job safe, and retrying is the only
            # recovery available when a publish fails halfway.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on the registry; skipping"
              return 0
            fi

            # `./` is load-bearing. npm reads a bare two-segment argument as a
            # GitHub shorthand, so `npm publish npm-dist/agentskillmap` tried to
            # clone github.com/npm-dist/agentskillmap and failed with a git
            # permission error that named neither the registry nor the package.
            # The five scoped packages were unaffected because
            # `npm-dist/@agentskillmap/win32-x64` does not match `owner/repo` —
            # so the bug hid until the last of six publishes.
            log="$(mktemp)"
            if npm publish "./$1" --access public --provenance 2>&1 | tee "$log"; then
              return 0
            fi
            echo "::error::npm publish failed for $1."
            if grep -q 'code EOTP' "$log"; then
              echo "::error::EOTP: the registry wants a one-time password, so this token does not bypass 2FA. CI cannot answer an OTP prompt and no workflow change makes it possible. Regenerate NPM_TOKEN as a classic *Automation* token or a granular access token — both bypass 2FA; a classic *Publish* token does not."
            elif grep -q 'code E404' "$log"; then
              echo "::error::E404 on a scoped package means the SCOPE, not the package: npm returns 404 rather than 403 for a scope you cannot write to, so it does not leak whether one exists. Either the organisation does not exist (https://www.npmjs.com/org/create) or this token cannot write to it."
            elif grep -q 'code E403' "$log"; then
              echo "::error::E403: the scope exists and this token may not write to it. A granular token created before the scope existed cannot have been granted that scope — regenerate it with the scope selected."
            elif grep -q 'code EPUBLISHCONFLICT\|cannot publish over' "$log"; then
              echo "::error::This version is already on the registry. npm forbids republishing a version; bump and cut a new tag."
            fi
            return 1
          }

          # Platform packages first. The wrapper's optionalDependencies pin exact
          # versions, so publishing it first would leave a window where
          # `npm install agentskillmap` resolves a wrapper whose binaries do not
          # exist.
          for package in npm-dist/@agentskillmap/*; do
            publish "$package"
          done
          publish npm-dist/agentskillmap
