[workspace]
resolver = "2"
members = [
    "crates/skillaudit-core",
    "crates/skillaudit-resolve",
    "crates/skillaudit-parse",
    "crates/skillaudit-rules",
    "crates/skillaudit-code",
    "crates/skillaudit-instr",
    "crates/skillaudit-semantic",
    "crates/skillaudit-policy",
    "crates/skillaudit-diff",
    "crates/skillaudit-corpus",
    "crates/skillaudit-eval",
    "crates/skillaudit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/OWNER/skillaudit"

[workspace.dependencies]
# Deliberately small. Every dependency here is one this project would have to
# defend in its own threat model — see SECURITY.md.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha2 = "0.10"
tree-sitter = "0.24"
toml = "0.8"
jsonschema = "0.26"

# Invariant 10: hostile input is the normal case. A parser panic is a DoS on
# someone's CI. These are denied workspace-wide and allowed only in the CLI
# binary and in tests, via targeted #[allow] with a comment explaining why.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
integer_division = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
