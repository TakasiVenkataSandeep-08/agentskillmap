[workspace]
resolver = "2"

# Only crates that exist. A crate joins this list when its task in docs/00-tasks.md
# begins — twelve empty crates would be twelve stubs (invariant 12), and a workspace
# that cannot resolve is worse than a short one. The full target layout, and the
# dependency direction it must obey, live in ARCHITECTURE.md.
members = [
    "crates/skillmap-core",
    "crates/skillmap-resolve",
    "crates/skillmap-parse",
    "crates/skillmap-corpus",
    "crates/skillmap-rules",
    "crates/skillmap-code",
    "crates/skillmap-instr",
    "crates/skillmap-semantic",
    "crates/skillmap-scan",
    "crates/skillmap-eval",
    "crates/skillmap-diff",
    "crates/skillmap-policy",
    "crates/skillmap-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
# Matches rust-toolchain.toml, and deliberately so: nothing in CI builds against
# an older compiler, and an MSRV nobody tests is a claim the project cannot back
# (invariant 12). Lowering it means adding a job that proves it, not editing this
# line. It is a floor imposed by dependencies, not by this project's own code:
# skillmap-corpus needs url -> idna -> icu_*, which require 1.86 or newer.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/agentskillmap/agentskillmap"

[workspace.dependencies]
# Intra-workspace dependencies carry BOTH a path and a version. The path is what
# a local build uses; the version is what crates.io requires, because a
# path-only dependency cannot be published at all. `cargo deny` found this — the
# workspace was quietly unpublishable, and would have stayed that way until T9's
# release attempt failed on it.
#
# T9 note: these are now correct and the workspace still does not publish to
# crates.io, for a different and more interesting reason. `skillmap-rules` embeds
# `rules/` and `queries/` from the workspace root at build time, and Cargo
# packages only files beneath a package's own directory. Distribution therefore
# goes through release binaries, npm, Homebrew, and `cargo install --git`. See
# docs/07-distribution.md for why the two obvious fixes are both worse.
#
# Declared here rather than in each member so a version bump is one edit.
# These must track `workspace.package.version` above. Nothing checks that
# automatically — but nothing needs to, because a mismatch fails `cargo build`
# immediately and loudly, which is the cheapest possible gate.
skillmap-core = { path = "crates/skillmap-core", version = "0.3.0" }
skillmap-resolve = { path = "crates/skillmap-resolve", version = "0.3.0" }
skillmap-parse = { path = "crates/skillmap-parse", version = "0.3.0" }
skillmap-rules = { path = "crates/skillmap-rules", version = "0.3.0" }
skillmap-code = { path = "crates/skillmap-code", version = "0.3.0" }
skillmap-instr = { path = "crates/skillmap-instr", version = "0.3.0" }
skillmap-corpus = { path = "crates/skillmap-corpus", version = "0.3.0" }
skillmap-semantic = { path = "crates/skillmap-semantic", version = "0.3.0" }
skillmap-scan = { path = "crates/skillmap-scan", version = "0.3.0" }
skillmap-eval = { path = "crates/skillmap-eval", version = "0.3.0" }
skillmap-diff = { path = "crates/skillmap-diff", version = "0.3.0" }
skillmap-policy = { path = "crates/skillmap-policy", version = "0.3.0" }
skillmap-cli = { path = "crates/skillmap-cli", version = "0.3.0" }

# Deliberately small. Every dependency here is one this project would have to
# defend in its own threat model — see SECURITY.md. `cargo deny check` gates
# additions; deny.toml is the policy.
serde = { version = "1", features = ["derive"] }
# No `preserve_order`. That feature swaps serde_json's default BTreeMap for an
# IndexMap, preserving *insertion* order — the exact opposite of the sorted keys
# invariant 2 requires. The default is already canonical.
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tree-sitter = "0.24"
toml = "0.8"

# NO JSON SCHEMA VALIDATOR HERE, deliberately. Proving the Rust types and
# schema/manifest-v1.schema.json cannot drift does not require one in this tree:
# `cargo test -p skillmap-core --test golden` proves the types still render
# crates/skillmap-core/tests/golden/manifest-maximal.json byte for byte, and
# `scripts/verify_spec.py --only golden-manifest` proves that file still validates
# against the schema. The loop closes in both directions across the two runners.
#
# The `jsonschema` crate would pull tokio, hyper, and reqwest — a full async HTTP
# stack — into the dev-dependencies of a supply-chain auditor whose SECURITY.md
# promises a minimal, defensible tree and no network. Python already owns the
# schema checks and already had the dependency.

# Invariant 10: hostile input is the normal case. A parser panic is a DoS on
# someone's CI. These are denied workspace-wide and allowed only in the CLI
# binary and in tests, via targeted #[allow] with a comment explaining why.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
integer_division = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
