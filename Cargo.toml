[workspace]
resolver = "2"

# Only crates that exist. A crate joins this list when its task in docs/00-tasks.md
# begins — twelve empty crates would be twelve stubs (invariant 12), and a workspace
# that cannot resolve is worse than a short one. The full target layout, and the
# dependency direction it must obey, live in ARCHITECTURE.md.
members = [
    "crates/skillmap-core",
    "crates/skillmap-resolve",
    "crates/skillmap-parse",
    "crates/skillmap-corpus",
    "crates/skillmap-rules",
    "crates/skillmap-code",
    "crates/skillmap-instr",
    "crates/skillmap-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Matches rust-toolchain.toml, and deliberately so: nothing in CI builds against
# an older compiler, and an MSRV nobody tests is a claim the project cannot back
# (invariant 12). Lowering it means adding a job that proves it, not editing this
# line. It is a floor imposed by dependencies, not by this project's own code:
# skillmap-corpus needs url -> idna -> icu_*, which require 1.86 or newer.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/skillmap/skillmap"

[workspace.dependencies]
# Deliberately small. Every dependency here is one this project would have to
# defend in its own threat model — see SECURITY.md. `cargo deny check` gates
# additions; deny.toml is the policy.
serde = { version = "1", features = ["derive"] }
# No `preserve_order`. That feature swaps serde_json's default BTreeMap for an
# IndexMap, preserving *insertion* order — the exact opposite of the sorted keys
# invariant 2 requires. The default is already canonical.
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tree-sitter = "0.24"
toml = "0.8"

# NO JSON SCHEMA VALIDATOR HERE, deliberately. Proving the Rust types and
# schema/manifest-v1.schema.json cannot drift does not require one in this tree:
# `cargo test -p skillmap-core --test golden` proves the types still render
# crates/skillmap-core/tests/golden/manifest-maximal.json byte for byte, and
# `scripts/verify_spec.py --only golden-manifest` proves that file still validates
# against the schema. The loop closes in both directions across the two runners.
#
# The `jsonschema` crate would pull tokio, hyper, and reqwest — a full async HTTP
# stack — into the dev-dependencies of a supply-chain auditor whose SECURITY.md
# promises a minimal, defensible tree and no network. Python already owns the
# schema checks and already had the dependency.

# Invariant 10: hostile input is the normal case. A parser panic is a DoS on
# someone's CI. These are denied workspace-wide and allowed only in the CLI
# binary and in tests, via targeted #[allow] with a comment explaining why.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
integer_division = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
