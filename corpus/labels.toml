# Ground truth for the sampled corpus.
#
# `docs/05-eval.md` requires precision and recall per capability term against a
# labeled corpus, and names the false-positive rate on the benign stratum as the
# headline metric. This file is that corpus. Without it every quality claim in
# this repository is unfalsifiable.
#
# ── How a label was produced ─────────────────────────────────────────────────
#
# By reading the bundle's source, via `scripts/label_worklist.py`, which prints
# the description and every markdown or supported-language file with line
# numbers. **skillmap's own output was not consulted.** A label derived from the
# scanner's verdict makes precision 1.0 by construction and turns the whole
# exercise into decoration.
#
# `capabilities` is what the bundle's code *actually does*, judged from the
# source — not what the rule set happens to cover. A script that reads a
# credential file the rule's prefix list does not name is still labelled
# `fs.read.credential`, and the rule counts as having missed it. That is the
# point: the metric has to be able to say the rules are incomplete.
#
# `evidence` is `path:line`, so any claim here can be checked in seconds against
# `corpus/raw/<digest>/`. A label nobody can check is an opinion.
#
# ── Decision rules, fixed before the pass that used them ─────────────────────
#
# Written down first, because a judgement call made fresh on each bundle is not
# reproducible and a second annotator would disagree at random. Where a rule
# looks arbitrary it is recorded with the reason, so disagreeing with it is a
# discussion about the rule rather than about a hundred separate bundles.
#
# `net.egress` — the bundle's OWN code opens a socket or issues a request. A URL
#   in prose does not count. An unused `import requests` does not count.
#   **Invoking a CLI that is known to be networked — `gh`, `aws`, `npm install`,
#   `git push` — counts as `process.exec` and NOT as `net.egress`.** This is the
#   rule most likely to be argued with, so: the code plane can never see inside
#   `gh`, so labelling that as egress would manufacture a false negative no rule
#   could ever fix, permanently. Shell `curl`/`wget` DOES count, because there
#   the script names the protocol itself.
#
# `process.exec` vs `process.exec.dynamic` — whether argv[0] is statically
#   known. `subprocess.run(["git", "status"])` is `process.exec`;
#   `subprocess.run(cmd)` where `cmd` is built, or `shell=True` with an
#   interpolated string, is `process.exec.dynamic`. A bundle can carry both.
#
#   **`process.exec` is scoped to python/javascript/typescript. Shell is out of
#   scope for it, and this is a limit of the term rather than of the pass.** In
#   python, calling `subprocess` is a distinct act a reader learns something
#   from. In shell, running a command is the language's only verb — `echo` is an
#   exec — so a term that fires on every shell script carries no information and
#   its recall would measure how many bundles ship a `.sh` file. Decided during
#   the pass, on the first shell bundle, where `$(echo "$PAYLOAD" | jq -r ...)`
#   would otherwise have been a true positive that told the reader nothing.
#   `process.exec.dynamic` IS labelled for shell: `bash -c "$x"` and `$CMD args`
#   are distinct acts there, not the ambient condition.
#
# `code.dynamic_eval` — a string becomes code. `json.loads` is not.
#   `model.eval()` is not — that is a PyTorch mode switch and it is everywhere.
#
# `fs.read.outside_bundle` / `fs.write.outside_bundle` — the bundle opens a file
#   that is not inside its own directory. A path is INSIDE only if it is
#   relative and descending (`scripts/x.py`, `templates/default.toml`); absolute
#   paths, `~/` paths and `../` paths are outside, and so is anything built from
#   `Path.home()`, `os.homedir()`, `$HOME`, `expanduser`, `tempfile` or `/tmp`.
#
#   **Judged from the ACT, not from the prefix list the rule uses.** These two
#   need that guard more than the other terms did, because here the rule's
#   `[match]` data is almost the definition of the term rather than a list of
#   interesting names — so labelling by "does this path start with / or ~/"
#   would make precision 1.0 by construction and measure nothing at all.
#
#   Concretely: a path the labeller can see is outside but the ENGINE cannot
#   resolve — a directory read from config, a base path passed as an argument,
#   a variable assigned twice — is still labelled. Those are what make recall a
#   real number rather than a restatement of the filter.
#
#   `scripts/../assets/x` resolves back inside the bundle and is NOT outside;
#   `../sibling-skill/x` is. Reading `~/.aws/credentials` is both a credential
#   read and an outside read, and both are labelled — they answer different
#   questions and neither replaces the other. A path merely PRINTED, or named in
#   a message telling the user what to create, is not opened.
#
# `env.read.secret` — judged from the variable's NAME, by the labeller, with the
#   name recorded in `note` and `path:line` in `evidence`. That inversion is
#   deliberate and it is the anti-circularity device for this term: the rule's
#   regex can later be audited against these labels, instead of these labels
#   being an echo of the regex. `scripts/label_worklist.py --view env` filters on
#   "reads the environment at all" and never on `TOKEN|KEY|SECRET`, for the same
#   reason.
#
# Sites were found with `scripts/label_worklist.py --view net,exec,eval,env,fs`,
# which filters by *mechanism* — an API that can do the thing — and never by the
# property being judged. "I saw every line in this bundle that could open a
# socket" is a checkable claim about a committed filter.
#
# ORDERING, which is the safety property and is easy to get backwards: this pass
# ran BEFORE any rule existed for the terms it added. Widening `terms_labelled`
# is free while nothing detects a term — precision is 0/0 and recall an honest
# 0/N. Doing it after a rule ships instead scores every genuine detection as a
# false positive, because an empty `capabilities` array means "not looked for",
# not "not present". `crates/skillmap-eval/tests/gate.rs` enforces the pairing;
# the commit order is what makes the claim checkable.
#
# ── What this file is not ────────────────────────────────────────────────────
#
# **Partially reviewed, and the review found the first annotator wrong every
# time.** A second annotator independently labelled 23 of the 92 bundles — a
# seeded 15% control sample plus every judgement the first annotator had flagged
# as contested — blind to this file and without running the scanner.
#
#   raw bundle-level agreement   18/23 (78.3%)
#   disagreements adjudicated     5, all in the second annotator's favour
#
# That last number is the finding. Three disagreements were the same systematic
# miss: egress reached through a **vendor SDK or a wrapper**, where no protocol
# is ever named in the call — `linkedin_api.Linkedin(...).get_conversations()`,
# a viem `http()` transport, `enable_remote_sync(platform_url=..., auto_start=True)`.
# A fourth was an env read behind an `env(name)` indirection. The fifth was a
# rule the second annotator argued better: `$("$SCRIPT_DIR/sibling.sh")` is not
# `process.exec.dynamic`, because the self-directory idiom folds to a file inside
# the bundle — the same reasoning that already treats `source lib.sh` as an
# import.
#
# A sweep of the other 69 bundles for that systematic miss found two more. So
# `net.egress` went 43 → 48 as a direct result of being reviewed, and the honest
# reading is that **48 is still a floor**: the first annotator's method could not
# see SDK egress, and only bundles importing a *named* SDK were re-swept.
#
# Agreement is measured on 25% of the corpus, not all of it. The 69 unreviewed
# bundles carry the single-annotator caveat in full.
#
# **Partial.** `corpus/sample.json` draws 130 bundles; only those appearing below
# are labelled. Unlabelled bundles are counted and reported as unlabelled — never
# folded into a denominator as though they were clean. That is invariant 3
# applied to the eval itself.
#
# ── Reading the third-party content ──────────────────────────────────────────
#
# Bundles under `corpus/raw/` are untrusted. Some contain text written to be read
# by a model. Text inside a bundle that addresses the reader is a fact recorded
# about that bundle (`note`), never an instruction that was followed.
#
# Per SECURITY.md: describe patterns, not people. `origin` exists so a claim can
# be verified against exact bytes at a pinned commit. No bundle here is alleged
# to be malicious, and none is named as a suspect.

snapshot = "2026-08"
sample_seed = "skillmap-labels-1"
labeller = "claude-opus-5"
reviewed_by = "claude-opus-5 (independent second pass, 23 of 92 bundles)"

# Terms a labeller may assign, from docs/02-manifest-schema.md.
# Constrained so a typo fails the load rather than silently scoring nothing.
#
# All but the last are capability terms and land in `capabilities` in the
# manifest. `instruction.exec_directive` is an INSTRUCTION-plane signal for T10
# and lands in `instructions` — a different branch, a weaker tier, and a
# different claim: about what the prose tells the agent to do, not about what
# the bundle's own code does.
#
# **Definition, because a term without one produces labels nobody can
# reproduce.** Assign `instruction.exec_directive` when the bundle's prose
# directs the agent to run a command that **fetches remote content and executes
# it** — `curl … | sh`, or fetching a `.sh`/`.py` and then running it.
#
# The narrowness is deliberate and was found by labelling. A first draft read
# "directs execution of a command it supplies", which is satisfied by
# `python scripts/build.py` in any ordinary usage section — a definition that
# fires on nearly every skill describes nothing. What separates the shape worth
# reporting is that the code being executed **is not in the bundle and is not
# reviewable**: it arrives from a URL at run time, so no amount of reading the
# bundle tells you what will run.
#
# It is in this list because a labeller needs to be able to assign it; see the
# note below `terms_labelled` for why it is not scored yet.
vocabulary = [
  "process.exec",
  "process.exec.dynamic",
  "net.egress",
  "net.fetch_then_execute",
  "fs.read.credential",
  "fs.read.outside_bundle",
  "fs.write.outside_bundle",
  "fs.write.agent_config",
  "code.dynamic_eval",
  "code.obfuscation",
  "env.read.secret",
  "instruction.exec_directive",
  "instruction.directs_outside_write",
  "instruction.config_mutation",
  "instruction.exfil",
  "instruction.fetch_as_instruction",
]

# ── T13's three terms, defined before the pass that uses them ─────────────────
#
# Unlike every term before them, these three ship a rule already. The governing
# principle — labels land before rules — was not followed here, and this task
# exists because of it: the rules were written at T5 from the threat model and
# have carried no precision and no recall since. So the definitions below are
# written against **the claim each signal's own documentation makes**, not
# against what its regex happens to match. Measuring a rule against a definition
# reverse-engineered from the rule is how a detector scores 1.0 and means
# nothing.
#
# `instruction.config_mutation`
#   The prose directs adding, editing, or installing something into an **agent
#   configuration that outlives the session**: CLAUDE.md, AGENTS.md,
#   settings.json, .mcp.json, or the registration of a hook, MCP server, or
#   subagent.
#
#   Counted whether the directive addresses the agent or the reader. A SKILL.md
#   is read by the agent, and "add this block to your settings.json" is a
#   directive in either voice. Distinguishing them would need intent the text
#   does not carry.
#
#   NOT the term: documentation *about* agent configuration that directs no
#   edit — this repository's own docs are the negative fixture — and a skill
#   writing its own config file inside its own bundle, which outlives nothing.
#
# `instruction.exfil`
#   The prose directs **data of the user's** to a destination outside the user's
#   machine. Both halves are required: something belonging to the user or their
#   environment, and somewhere external it is going.
#
#   Deliberately not "malicious exfiltration". The shipped rationale says half
#   of what this matches is legitimate — telemetry, backup, deploy, log shipping
#   — and invariant 1 puts that judgement in `policy.toml`, not here. A skill
#   that uploads a backup by design is a true positive with a benign note.
#
#   NOT the term: sending content the skill itself generated to an API the skill
#   exists to call, where nothing of the user's crosses the boundary; and prose
#   warning *against* exfiltration, which the shipped notes already predict.
#
# `instruction.fetch_as_instruction`
#   The prose tells the agent to fetch content from a URL or remote location and
#   then **treat that content as instructions to follow** — the indirect
#   prompt-injection setup the signal's documentation describes.
#
#   The decision most likely to be argued with, so it is fixed here: **"download
#   this script and run it" is NOT this term.** That is code fetched and
#   executed, which `net.fetch_then_execute` and `instruction.exec_directive`
#   already name. This term is about fetched text becoming *directives for the
#   agent*, which is a different failure and the one the signal claims.
#
#   The rule's regex is broader than that claim and will fire on the execute
#   case. That gap is the measurement, not a labelling error: if precision is
#   poor because of it, the remedy is to narrow the rule or restate the signal,
#   and both are decisions for phase 2 with the numbers in hand.
#
# ── The four strata drawn for them ────────────────────────────────────────────
#
# `scripts/draw_instruction_strata.py`, seed `skillmap-instruction-1`, into
# `corpus/sample-instruction.json`. Already-labelled digests are excluded, so no
# bundle appears in two denominators.
#
#   instr_config_mutation    40 of 178    the config-mutation shape
#   instr_exfil              40 of 171    the exfil shape
#   instr_fetch_instruction  36 of 36     a CENSUS. The population is too small
#                                         to sample, so every bundle is read and
#                                         the resulting precision is exact
#                                         rather than an interval.
#   instr_control            40 of 11890  trips none of the three shapes, drawn
#                                         from probes 42x, 16x and 145x looser
#                                         than the rules. A control drawn at
#                                         random would be padded with bundles
#                                         that were never at risk.
#
# **All four strata are labelled for all three terms**, and scored for all
# three. A bundle drawn for `exfil` whose prose also directs a config edit is a
# `config_mutation` datapoint, and if the rule stayed silent it is a *miss* —
# which is where recall comes from. The denominator is therefore enriched for
# these three shapes and is a real denominator, not a complete one.
#
# The terms are NOT in `terms_labelled` and these strata are NOT in
# `strata_scored`. `corpus::run` scores `terms_labelled` against `capabilities`,
# so an instruction term there scores 0 recall forever, and scoring a stratum
# read for instruction signals against the eight capability terms is what moved
# published precision 113/113 to 113/119 during T11.

# ── T11's term, defined before anything is labelled ───────────────────────────
#
# `instruction.directs_outside_write`
#   The prose directs the agent to run a command that **writes data to, copies
#   into, or makes executable** a path outside the bundle.
#
# It describes code in a fenced block inside a bundle that ships no parseable
# file at all. The bundle performs nothing; it tells the agent to. So it is an
# instruction signal and what is reported is the directive, never a capability
# of the bundle.
#
# **Why this shape and not the three it replaces.** `directs_egress`,
# `directs_credential_access` and `directs_exec` were defined first and the
# corpus declined all three: in a prose-only bundle the dominant genre is
# reference material, so a network call or a subprocess spawn inside a code
# sample is not the prose directing anything, and at 23-26% base rates with no
# contextual separator they were noise generators. Requiring an operative
# heading was measured as a rescue and failed — 30% of the *control* stratum sat
# under one, against 25-40% of the positives.
#
# What survives is a shape carrying its own intent: reference material
# demonstrates logic and never mutates the reader machine as an illustration.
# Nobody teaches programming by appending to a shell profile.
#
# **Two exclusions, both deliberate.** `mkdir` alone is not a write — creating
# an empty directory is preparation and near-zero consequence, and at 3.11% it
# would have flooded the draw with candidates whose worst case is an empty
# folder. `sudo` is excluded for the opposite reason: inherently operative and
# almost worthless, being a package-manager invocation in nearly all of its 218
# instances.
#
# **Outside the bundle** means a path under the home directory, /etc, /usr/local
# or /opt. A relative path staying inside the bundle is not this term, however
# alarming it looks.

# Terms looked for exhaustively, and therefore the only terms precision and
# recall are computed for.
#
# Six terms, after a second pass over all 92 labelled bundles that hunted for
# five more. The bar for this list is "looked for exhaustively", NOT "has a
# usable sample size" — those are different claims, and conflating them would
# quietly suppress the terms where the answer is "we looked, and there is
# almost nothing here", which is itself a finding.
#
#   net.egress            48     process.exec            5
#   env.read.secret       27     process.exec.dynamic    2
#   fs.read.credential    18     code.dynamic_eval       1
#
# The last two carry n < 5 and their intervals will be nearly the whole unit
# range. That is the honest reading and the reason every rate here carries one:
# `code.dynamic_eval` at 1/92 cannot distinguish a good detector from a bad one,
# and the fixture and adversarial suites have to carry that term instead.
#
# Seven terms remain unscored and are still noted opportunistically in `note`:
# the two outside_bundle terms need per-site path reasoning relative to the
# bundle root, `net.fetch_then_execute` and `code.obfuscation` are chain
# judgements connecting two sites, and `agent.hook.install`,
# `fs.write.agent_config` and `mcp.tool_reference` are each too rare here to
# support a rate. Widening this list again means another pass, not another line.
# Terms a shipped rule detects that this labelling has NOT covered exhaustively.
# Every entry is a published gap; `crates/skillmap-eval/tests/gate.rs` requires
# one of the two lists to name every term with a rule, so nothing detects
# silently.
#
# All three are chain or rarity cases the Phase-2 batch deliberately excluded:
#
#   code.obfuscation        a decode and a sink in ONE expression. Two sites to
#                           connect, and lexically ~6/92, so a rate would be
#                           built on a handful either way.
#   net.fetch_then_execute  same shape, same reason.
#   fs.write.agent_config   2/92 lexically. n<5 cannot support a rate, which is
#                           the argument `MIN_PER_STRATUM` already makes.
#
# The eval prints the bundle count for each of these above the false-positive
# block, so the gap is visible next to the number it qualifies rather than only
# here. Moving one of these into `terms_labelled` means another reading pass.
terms_detected_unscored = [
  "code.obfuscation",
  "net.fetch_then_execute",
  "fs.write.agent_config",
]

terms_labelled = [
  "fs.read.credential",
  "net.egress",
  "env.read.secret",
  "process.exec",
  "process.exec.dynamic",
  "code.dynamic_eval",
  "fs.read.outside_bundle",
  "fs.write.outside_bundle",
]

# The strata over which the terms above were looked for exhaustively — the
# original five-stratum draw, and only those.
#
# This list exists because omitting it was wrong in a measurable way. T10's
# `fence_directive` bundles were read for one instruction signal, not for the
# eight capability terms above; scoring them anyway read their silence as
# observation and turned genuine detections into false positives, taking
# published precision from 113/113 to 113/119 in a single run. The bundles were
# fine and the labels were fine — the harness was scoring ground truth that had
# never been gathered.
#
# `prose_only` is absent because it is deliberately unlabelled, and the two T10
# strata are absent until a pass reads them for capability terms as well.
strata_scored = [
  "code_clean",
  "code_credential",
  "code_other_marker",
  "disclosure_shape",
]

# ── T10 in progress: why `instruction.exec_directive` is NOT in the list above ──
#
# The governing principle says a term's labelling lands before its first rule,
# and widening `terms_labelled` is free while nothing detects the term. Both
# still hold — no rule for this term exists. What does not hold yet is the
# precondition the list itself states: **"looked for exhaustively."**
#
# `terms_labelled` is scored across every labelled bundle. The 92 bundles above
# were read for capability terms in code files; none was read for a directive in
# a fenced block. Adding the term now would score all 92 as negatives by
# omission — an empty array meaning "not looked for" read as "not present" —
# which is the precision-collapse failure this file's header describes, arriving
# by a different door.
#
# So the term is assignable (it is in `vocabulary`) and is being labelled on the
# two strata drawn for it. It joins `terms_labelled` when either the existing 92
# have been passed over for it, or the harness scores per stratum rather than
# globally. That decision belongs to T10 phase 3, with the rule, and it is a
# decision — not a step to be skipped because the list looks short.
#
# ── The two strata drawn for it ────────────────────────────────────────────────
#
# Drawn by `scripts/draw_fence_stratum.py`, seed `skillmap-fence-1`, into
# `corpus/sample-fence.json`. Supplementary rather than a sixth `Stratum`
# variant: the five in `skillmap-corpus` are disjoint by construction, so
# inserting one would reclassify bundles already in `code_clean` and
# `code_other_marker` and move published per-stratum rates for reasons unrelated
# to detection. Already-labelled digests are excluded, so no bundle appears in
# two denominators.
#
#   fence_directive  40 drawn from 247 — SKILL.md has a shell fence that pipes a
#                    fetch into a shell, or fetches a .sh/.py and runs it.
#   fence_control    40 drawn from 11534 — a shell fence and neither shape.
#                    Ordinary usage examples: the false positives this signal
#                    will actually face. Drawing controls from the whole corpus
#                    would pad the denominator with bundles that were never at
#                    risk of a false positive.
#
# **The draw selects a shape, never a verdict.** A skill documenting
# `curl … | sh` to install a real tool is doing something ordinary, and most
# positives are expected to be exactly that. Whether a directive is benign is
# the labeller's judgement per bundle, and `policy.toml` decides what a
# repository tolerates. Invariant 1 applies here more sharply than anywhere else
# in the taxonomy.

