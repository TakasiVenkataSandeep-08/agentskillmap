# ══ T13 PHASE 1 COMPLETE: all three signals measured ═════════════════════════
#
# 156 bundles drawn across four strata. 145 labelled, 11 unscoreable as
# too_large. 137 distinct entry texts among the 145, so the effective sample is
# smaller than the count in every figure below.
#
#   term                            precision        recall
#   instruction.config_mutation     21/32 (65.6%)    21/48 (43.8%)
#   instruction.exfil                2/36 ( 5.6%)     2/12 (16.7%)
#   instruction.fetch_as_instruction 10/30 (33.3%)   10/18 (55.6%)
#
# All three fail, and the recall figures are OPTIMISTIC because the denominator
# is enriched for the rules' own shapes. The independent check is worse: the one
# MCP-registration phrasing the config rule cannot match appears in 1915 of
# 34302 bundles, against 193 the rule fires on in total.
#
# The causes are structural, not tuning. Three of them, each measured:
#
# 1. THE PATTERN ANCHORS ON THE WRONG THING. config_mutation wants the config
#    noun immediately after an article and real prose puts a word in between -
#    add the COMPOSIO mcp server, add A URL as an mcp server, configuring the
#    STOP hook. Its other branch wants a preposition and real prose writes
#    create or update CLAUDE.md WITH this template. Both branches, same defect.
#
# 2. VERBS ARE POLYSEMOUS AND THE RULES MATCH VERBS. Across this pass: hook
#    means agent hook, git hook, React hook, a CLI subcommand, and a
#    monkey-patched browser API. Send and transfer usually mean moving crypto
#    tokens. Post means publishing text, and also post-processing. Push means
#    delivering mobile notifications. Report means writing a local file.
#
# 3. THE TIER CANNOT SEPARATE DESCRIPTION FROM INSTRUCTION, WHICH IS THE ONE
#    FAILURE THE SHIPPED NOTES PREDICTED, AND IT IS THE LARGEST. Security
#    scanners enumerating the shapes they detect. A hardening policy that is
#    nothing but prohibitions. A finance skill firing on a section saying it
#    cannot move funds. Command reference tables. API code samples. Bundles
#    specifying software that does not exist yet. And, twice, a bundle firing on
#    its own DISCLOSURE of the risk - while another bundle disclosing the
#    absence of the same behaviour is correctly ignored, which shows the
#    difference is sentence shape rather than meaning.
#
# What the pass found that no rule was looking for: SIX bundles whose operative
# instructions are not in the bundle at all. Four overwrite their own entry
# document under the home directory from a vendor URL; one declares its shipped
# file deliberately incomplete and tells the agent to curl the real thing; one
# ships a single file and falls back to fetching its protocol rules from a raw
# file URL. That is a coherent and checkable shape, and it is the strongest
# candidate in this task for a signal worth having.
#
# Four definitional edges are recorded where they were read, not after the
# numbers came out: a workspace personality file, a crontab installation, a
# heartbeat-file registration, and a skill overwriting its own definition. All
# four change behaviour durably and none is a filename the config_mutation
# definition enumerates. Widening the term to cover persistence rather than a
# filename list moves precision on its own stratum from 20/29 to 22/29 without
# touching a regex.

# ══ T13 PHASE 2: diagnosis, a correction to my own labels, and the numbers ════
#
# EIGHT LABELS WERE WRONG AND ARE CORRECTED ABOVE. Eight bundles in the exfil
# stratum carry the self-overwriting shape - curl a remote document over their
# own entry or heartbeat file under the home directory - and I labelled all
# eight as carrying no term. That is the shape phase 1 called its most important
# finding, missed in the stratum where it was most concentrated.
#
# The cause is on the record because it is the more useful half. I triaged that
# ecosystem with a filter tuned to send verbs, so the install block never
# appeared. Then I ran a grep specifically for this pattern across three of
# those bundles, got a zero, and accepted it without opening the files. The zero
# was wrong. Relying on a grep instead of reading is precisely the failure the
# labelling method is built to prevent, and it took a rule experiment to catch.
#
# Corrected phase 1 numbers, shipped rules, all four strata:
#
#   term                              precision        recall
#   instruction.config_mutation       21/32 (65.6%)    21/48 (43.8%)
#   instruction.exfil                  2/36 ( 5.6%)     2/12 (16.7%)
#   instruction.fetch_as_instruction  10/30 (33.3%)    10/26 (38.5%)
#
# fetch_as_instruction is worse than phase 1 reported: recall falls from 55.6%
# to 38.5%, because eight of its real positives were hidden in my own labels.
#
# ── Three mechanical causes, each isolated by experiment ─────────────────────
#
# THE PERIOD EXCLUSION BLOCKS URLS. Every pattern uses [^.\n] to keep a match
# inside one sentence. fetch_as_instruction is a signal ABOUT URLs, and URLs
# contain periods, so its first pattern cannot span the thing it exists to
# detect. "Fetch https://host/heartbeat.md and follow it" matches only once the
# exclusion is relaxed.
#
# TABLES ARE INVISIBLE. The queries match (inline) nodes. A probe with the same
# sentence in five positions shows paragraphs, lists and blockquotes fire while
# TABLE CELLS AND FENCE BODIES DO NOT. Measured corpus-wide the effect is real
# but small: 15 config_mutation bundles, 5 exfil, 1 fetch match only inside a
# table. Worth fixing, not the main story - the first draft of this note called
# it major before it was measured.
#
# THE PATTERNS ANCHOR ON ADJACENCY. config_mutation wants its noun immediately
# after an article, and real prose writes "add the Composio MCP server" or "add
# a URL as an MCP server" or "configuring the Stop hook".
#
# ── What repair does to each term, measured against these labels ─────────────
#
# exfil CANNOT BE RESCUED, and this was tested rather than assumed. Bare "token"
# in its sensitive-noun list means a crypto coin in most of this corpus, and its
# false positives are dominated by prohibition prose. Qualifying the noun:
# 1/30. Adding a negation guard as well: 0/7 - the guard removes 23 false
# positives and BOTH true positives with them. Every repair path measured makes
# it worse than 2/36.
#
# config_mutation REPAIRS ON RECALL ONLY. Allowing a bounded gap between verb
# and noun and permitting periods takes it from 24/38 precision, 24/48 recall to
# 38/59 precision, 38/48 recall - half the misses closed, precision unchanged at
# about 64%. What remains is not reachable by any pattern: security scanners
# enumerating what they detect, git-hooks skills, and two definitional edges.
#
# fetch_as_instruction NARROWED TO THE SHAPE IT ACTUALLY DETECTS scores
# 18/18 precision and 18/26 recall. Four patterns: a remote document curled over
# an entry or heartbeat file, a fetch of a .md followed by follow or execute, a
# file declaring itself incomplete and naming where the real one is, and
# following instructions at a URL. No false positives at all on 145 labelled
# bundles.
#
# THAT LAST NUMBER IS IN-SAMPLE AND MUST NOT BE PUBLISHED AS IT STANDS. The
# patterns were written after reading the bundles they are scored against, so
# 18/18 is what fitting looks like, not what precision looks like. It needs a
# fresh seeded draw against bundles no one has read. That is phase 3's first
# job, before any of this ships.
