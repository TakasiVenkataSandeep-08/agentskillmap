# ── T13: instr_fetch_instruction ──────────────────────────────────────────────
#
# A CENSUS, not a sample: 36 bundles is the whole population the probe found, so
# every one is read and the resulting precision is exact.
#
# **Seven of the 36 are duplicate prose.** Five groups share a byte-identical
# SKILL.md, so the census covers 36 bundles and 29 distinct texts. That is a
# property of the population rather than of the draw - a rare shape is where
# republished copies of one skill concentrate - and it means the interval on any
# rate computed here is optimistic. Both counts are reported.

[[label]]
digest = "sha256:3e878956877c27ef2bdb5b48fddf5f2c004aef7d9f2fbc0fcee735f40ae69ae7"
stratum = "instr_fetch_instruction"
verdict = "labelled"
capabilities = ["instruction.fetch_as_instruction"]
evidence = ["SKILL.md:18"]
note = "Points the agent at a remote document and tells it to fetch that document and follow what it says. The operative instructions live off-bundle and can change after any review. Textbook shape for this term."

[[label]]
digest = "sha256:3e030f10450378775a66f3ef48fd32e885d388c8b92e65cf4e5cfce45e8d510f"
stratum = "instr_fetch_instruction"
verdict = "labelled"
capabilities = ["instruction.fetch_as_instruction"]
evidence = ["SKILL.md:64"]
note = "A registry client that downloads another skill into a temp directory and then directs the agent to read the fetched SKILL.md and follow its instructions. The fetched text becomes the agent instruction set, which is exactly the claim this term makes."

[[label]]
digest = "sha256:baca2ed1f69856ad7e3246e24fc5501ead3de372d5857116334c71bdf192ece5"
stratum = "instr_fetch_instruction"
verdict = "labelled"
capabilities = ["instruction.fetch_as_instruction"]
evidence = ["SKILL.md:64"]
note = "Byte-identical SKILL.md to another bundle in this stratum, republished under a different digest. Same judgement, and counted once in the distinct-text figure."

[[label]]
digest = "sha256:baa4732747cc60a7171f0883aabd07c2fd5ea2432f19037a75f0e91c06d9a2ca"
stratum = "instr_fetch_instruction"
verdict = "labelled"
capabilities = []
evidence = []
note = "Malware-analysis skill for legacy spreadsheet macros. The matching phrase describes what the analysed sample does - download-and-run primitives to look for - and directs the agent to do none of it. The predicted describes-rather-than-instructs class, which the shipped rule notes already name."

[[label]]
digest = "sha256:c82aecc86ce27f37f57b05cce713b85f081777a846d760e30bfec4a703dd8b52"
stratum = "instr_fetch_instruction"
verdict = "labelled"
capabilities = []
evidence = []
note = "Terminal-simulator prompt skill. It defines a convention for the current conversation - text inside braces is meant as instruction rather than as a command to run - and fetches nothing at all. A distinct artifact class from the describes-rather-than-instructs one: the phrasing matches while the remote half of the shape is absent."

[[label]]
digest = "sha256:5d09beee59c63c0bbed06ff56f1456e5a44917cb0c057be24c6ed46e4c9bca80"
stratum = "instr_fetch_instruction"
verdict = "labelled"
capabilities = ["instruction.config_mutation"]
evidence = ["SKILL.md:82"]
note = "Skill-security scanner. It directs the reader to copy a policy block into AGENTS.md, which is a real config mutation and outlives the skill. Its fetch-shaped phrases are a table of dangerous patterns to detect, so this bundle is a positive for one term and the describes-rather-than-instructs class for another, in the same file."

[[label]]
digest = "sha256:0d75de1987525c5d86dc210f157482c1d5e765b2fc39ae91dbef89dce8b3c576"
stratum = "instr_fetch_instruction"
verdict = "labelled"
capabilities = ["instruction.fetch_as_instruction"]
evidence = ["SKILL.md:36"]
note = "Avatar-minting service. Directs the agent to fetch a remote heartbeat document on a schedule and run it, and the fetched document in turn overwrites the skill own SKILL.md from a URL when a version changes. EDGE CASE for the config_mutation definition fixed before this pass: overwriting a skill definition under the home directory is arguably the most consequential configuration change here, and the definition names only agent config files, so it is recorded and not counted. Flagged for phase 2."

[[label]]
digest = "sha256:61d158f921ea74cd7fab0f85ac44d27e9924b7d37d868fcfd6e2ce82952ef1a9"
stratum = "instr_fetch_instruction"
verdict = "labelled"
capabilities = ["instruction.exfil", "instruction.fetch_as_instruction"]
evidence = ["SKILL.md:17", "SKILL.md:21"]
note = "Preference-learning service. Directs the agent to send whole conversations to an external API, which is user data leaving by design and a benign true positive of the kind the shipped rationale predicts. Separately directs the agent to fetch a stored profile before responding and follow it, and the bundle own words call the result suitable for system prompt injection - benign in intent and structurally the shape this term names."

[[label]]
digest = "sha256:61eaf99909295434c3d5978ac065619ffb6149c0841a2310976523bd306fca10"
