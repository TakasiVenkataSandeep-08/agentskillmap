# 40 bundles drawn from 171. One too_large.
#
# The stratum has a visible genre concentration: eight bundles carry names from
# one agent-social ecosystem, and many of the rest are registration-and-post
# services for agents. That is not a draw artifact - it is what prose matching
# send-something-somewhere looks like in this corpus - but it means the
# false-positive picture here describes that genre more than it describes skills
# in general.

