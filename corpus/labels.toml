# ── T13 phase 1: the config_mutation stratum, measured ────────────────────────
#
# 40 bundles, 34 labelled, 6 too_large.
#
#   instruction.config_mutation   precision 20/29 (69.0%)   fn 3
#
# The headline number is less useful than its composition, because the nine
# false positives are not nine independent failures:
#
#   5  the shared-preamble family. Five bundles with different bodies - context
#      saving, iOS builds, a release dashboard, teaching, model benchmarking -
#      carrying one identical eighteen-line shell preamble that READS a
#      toolchain's own configuration. One boilerplate block, five false
#      positives, and no duplicate check sees it because the bodies differ.
#   2  the git-hook collision. Pre-commit setup skills touching no agent
#      configuration at all. The pattern matches the bare noun after set up,
#      install or add, and hook is four different words in this stratum: agent
#      hook, git hook, React hook, vendor CLI subcommand.
#   2  the definitional edges, where the RULE IS ARGUABLY RIGHT AND THE
#      DEFINITION WRONG: a personality file in the workspace root that shapes
#      every response, and crontab entries running a skill's own scripts every
#      three hours forever. Both change behaviour durably; neither is a filename
#      the definition enumerates. If phase 2 widens the term, precision here
#      becomes 22/29 without touching a regex.
#
# The three misses are one structural weakness, not three. The rule's first
# pattern requires a preposition - add X TO CLAUDE.md - and real prose does not
# supply one: "Create or update CLAUDE.md with this template" is missed. Its
# second pattern requires the config noun immediately after the article, and
# real prose puts a product name in between: "Add the Composio MCP server",
# "Add MCP server to Codex". Both are fixable on this evidence.
#
# exfil and fetch_as_instruction cannot be scored here. This stratum was
# selected by the config probe, so their positives were never sampled for. Both
# their misses are recorded: two bundles direct user data to an external
# service - documents into a hosted workspace, triples to a SPARQL endpoint -
# and the exfil rule fired on neither.

# ── T13: instr_exfil ──────────────────────────────────────────────────────────
