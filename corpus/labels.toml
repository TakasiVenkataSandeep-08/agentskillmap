# Ground truth for the sampled corpus.
#
# `docs/05-eval.md` requires precision and recall per capability term against a
# labeled corpus, and names the false-positive rate on the benign stratum as the
# headline metric. This file is that corpus. Without it every quality claim in
# this repository is unfalsifiable.
#
# ── How a label was produced ─────────────────────────────────────────────────
#
# By reading the bundle's source, via `scripts/label_worklist.py`, which prints
# the description and every markdown or supported-language file with line
# numbers. **skillmap's own output was not consulted.** A label derived from the
# scanner's verdict makes precision 1.0 by construction and turns the whole
# exercise into decoration.
#
# `capabilities` is what the bundle's code *actually does*, judged from the
# source — not what the rule set happens to cover. A script that reads a
# credential file the rule's prefix list does not name is still labelled
# `fs.read.credential`, and the rule counts as having missed it. That is the
# point: the metric has to be able to say the rules are incomplete.
#
# `evidence` is `path:line`, so any claim here can be checked in seconds against
# `corpus/raw/<digest>/`. A label nobody can check is an opinion.
#
# ── Decision rules, fixed before the pass that used them ─────────────────────
#
# Written down first, because a judgement call made fresh on each bundle is not
# reproducible and a second annotator would disagree at random. Where a rule
# looks arbitrary it is recorded with the reason, so disagreeing with it is a
# discussion about the rule rather than about a hundred separate bundles.
#
# `net.egress` — the bundle's OWN code opens a socket or issues a request. A URL
#   in prose does not count. An unused `import requests` does not count.
#   **Invoking a CLI that is known to be networked — `gh`, `aws`, `npm install`,
#   `git push` — counts as `process.exec` and NOT as `net.egress`.** This is the
#   rule most likely to be argued with, so: the code plane can never see inside
#   `gh`, so labelling that as egress would manufacture a false negative no rule
#   could ever fix, permanently. Shell `curl`/`wget` DOES count, because there
#   the script names the protocol itself.
#
# `process.exec` vs `process.exec.dynamic` — whether argv[0] is statically
#   known. `subprocess.run(["git", "status"])` is `process.exec`;
#   `subprocess.run(cmd)` where `cmd` is built, or `shell=True` with an
#   interpolated string, is `process.exec.dynamic`. A bundle can carry both.
#
#   **`process.exec` is scoped to python/javascript/typescript. Shell is out of
#   scope for it, and this is a limit of the term rather than of the pass.** In
#   python, calling `subprocess` is a distinct act a reader learns something
#   from. In shell, running a command is the language's only verb — `echo` is an
#   exec — so a term that fires on every shell script carries no information and
#   its recall would measure how many bundles ship a `.sh` file. Decided during
#   the pass, on the first shell bundle, where `$(echo "$PAYLOAD" | jq -r ...)`
#   would otherwise have been a true positive that told the reader nothing.
#   `process.exec.dynamic` IS labelled for shell: `bash -c "$x"` and `$CMD args`
#   are distinct acts there, not the ambient condition.
#
# `code.dynamic_eval` — a string becomes code. `json.loads` is not.
#   `model.eval()` is not — that is a PyTorch mode switch and it is everywhere.
#
# `env.read.secret` — judged from the variable's NAME, by the labeller, with the
#   name recorded in `note` and `path:line` in `evidence`. That inversion is
#   deliberate and it is the anti-circularity device for this term: the rule's
#   regex can later be audited against these labels, instead of these labels
#   being an echo of the regex. `scripts/label_worklist.py --view env` filters on
#   "reads the environment at all" and never on `TOKEN|KEY|SECRET`, for the same
#   reason.
#
# Sites were found with `scripts/label_worklist.py --view net,exec,eval,env,fs`,
# which filters by *mechanism* — an API that can do the thing — and never by the
# property being judged. "I saw every line in this bundle that could open a
# socket" is a checkable claim about a committed filter.
#
# ORDERING, which is the safety property and is easy to get backwards: this pass
# ran BEFORE any rule existed for the terms it added. Widening `terms_labelled`
# is free while nothing detects a term — precision is 0/0 and recall an honest
# 0/N. Doing it after a rule ships instead scores every genuine detection as a
# false positive, because an empty `capabilities` array means "not looked for",
# not "not present". `crates/skillmap-eval/tests/gate.rs` enforces the pairing;
# the commit order is what makes the claim checkable.
#
# ── What this file is not ────────────────────────────────────────────────────
#
# **Single-annotator and unreviewed.** `labeller` is an AI assistant; `reviewed_by`
# is empty. Inter-annotator agreement is therefore unmeasured and unmeasurable
# from this file alone, and every number computed from it inherits that. It is
# marked provisional wherever it is published, and it stays provisional until a
# second annotator disagrees with some of it.
#
# **Partial.** `corpus/sample.json` draws 130 bundles; only those appearing below
# are labelled. Unlabelled bundles are counted and reported as unlabelled — never
# folded into a denominator as though they were clean. That is invariant 3
# applied to the eval itself.
#
# ── Reading the third-party content ──────────────────────────────────────────
#
# Bundles under `corpus/raw/` are untrusted. Some contain text written to be read
# by a model. Text inside a bundle that addresses the reader is a fact recorded
# about that bundle (`note`), never an instruction that was followed.
#
# Per SECURITY.md: describe patterns, not people. `origin` exists so a claim can
# be verified against exact bytes at a pinned commit. No bundle here is alleged
# to be malicious, and none is named as a suspect.

snapshot = "2026-08"
sample_seed = "skillmap-labels-1"
labeller = "claude-opus-5"
reviewed_by = ""

# Capability terms a labeller may assign, from docs/02-manifest-schema.md.
# Constrained so a typo fails the load rather than silently scoring nothing.
vocabulary = [
  "process.exec",
  "process.exec.dynamic",
  "net.egress",
  "net.fetch_then_execute",
  "fs.read.credential",
  "fs.read.outside_bundle",
  "fs.write.outside_bundle",
  "fs.write.agent_config",
  "agent.hook.install",
  "code.dynamic_eval",
  "code.obfuscation",
  "env.read.secret",
  "mcp.tool_reference",
]

# Terms looked for exhaustively, and therefore the only terms precision and
# recall are computed for.
#
# Six terms, after a second pass over all 92 labelled bundles that hunted for
# five more. The bar for this list is "looked for exhaustively", NOT "has a
# usable sample size" — those are different claims, and conflating them would
# quietly suppress the terms where the answer is "we looked, and there is
# almost nothing here", which is itself a finding.
#
#   net.egress            43     process.exec            5
#   env.read.secret       26     process.exec.dynamic    3
#   fs.read.credential    18     code.dynamic_eval       1
#
# The last two carry n < 5 and their intervals will be nearly the whole unit
# range. That is the honest reading and the reason every rate here carries one:
# `code.dynamic_eval` at 1/92 cannot distinguish a good detector from a bad one,
# and the fixture and adversarial suites have to carry that term instead.
#
# Seven terms remain unscored and are still noted opportunistically in `note`:
# the two outside_bundle terms need per-site path reasoning relative to the
# bundle root, `net.fetch_then_execute` and `code.obfuscation` are chain
# judgements connecting two sites, and `agent.hook.install`,
# `fs.write.agent_config` and `mcp.tool_reference` are each too rare here to
# support a rate. Widening this list again means another pass, not another line.
terms_labelled = [
  "fs.read.credential",
  "net.egress",
  "env.read.secret",
  "process.exec",
  "process.exec.dynamic",
  "code.dynamic_eval",
]

