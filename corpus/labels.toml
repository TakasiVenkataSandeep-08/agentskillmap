[[label]]
digest = "sha256:2ff5df0ddc756ce7ec5f769f72edacf4578eeb7b1067840a4b316f0d1f37be06"
stratum = "code_credential"
verdict = "labelled"
capabilities = ["fs.read.credential"]
evidence = ["scripts/imap.js:13"]
disclosure_delta = false
# Scored a true positive, and it is worth recording that the scanner reached the
# right answer by the wrong route. It cited `setup.sh:137` — `cat > .env`, which
# *writes* the file — and did not cite the actual read at `scripts/imap.js:13`,
# `require('dotenv').config({ path: '../.env' })`. Two defects that happened to
# cancel: a shell false positive (since fixed, see queries/shell/credential-read.scm)
# and a JavaScript false negative (open, see docs/00-tasks.md Known gaps).
#
# Bundle-level scoring cannot see this. Site-level scoring would, and needs every
# label to carry complete evidence — a heavier labelling pass than this one.
note = "Loads ../.env through dotenv and reads IMAP/SMTP passwords from the environment; setup.sh writes those credentials into .env. Entirely disclosed: the description says it reads and sends email, and the configuration block documents every variable."

