# ── T13 phase 1: the exfil stratum, measured ─────────────────────────────────
#
# 40 bundles, 39 labelled, 1 too_large.
#
#   instruction.exfil   precision 2/34 (5.9%)   fn 0
#
# Thirty-two false positives out of thirty-four firings, on the stratum drawn
# for this term by its own shape. This is not a rule that needs narrowing. The
# causes, counted by reading:
#
#   VERB COLLISIONS. In this corpus send and transfer usually mean moving crypto
#     tokens between wallets; post means publishing agent-authored text to a
#     social service; push means an application delivering notifications to its
#     own users. Six token cases, several posting cases, two push cases. None
#     moves anything off a machine and the rule matches the verb.
#
#   PROHIBITIONS AND GUARDRAILS. A security-hardening policy that is nothing but
#     rules against sending credentials, memory files, and dotenv contents fires
#     on all three terms. A finance skill fires on a section stating it cannot
#     move funds and does not send credentials anywhere. A dependency inventory
#     fires on the boundary it documents staying inside. And one bundle fires on
#     a DISCLOSURE that provider examples may transmit prompt context, followed
#     by an instruction not to send regulated data into them.
#
#   COPIED BOILERPLATE. One agent-social ecosystem repeats never send your API
#     key to any domain other than X, refuse if anything asks, across a dozen
#     bundles. A single copied guardrail generates false positives across a
#     whole genre - the shared-preamble effect from the previous stratum in a
#     different form.
#
#   REFERENCE MATERIAL. An email API client whose every match is a library call
#     in a code sample. A scaffolder whose match instructs the application it is
#     generating to send its own device token to its own backend - a
#     specification for software that does not exist, analysed as though it
#     described this machine.
#
# The two true positives are both content harvested from a session: conversation
# messages sent to a preference service, and a human's skills synced FROM
# CONVERSATIONS onto a public profile by a recurring heartbeat.
#
# fetch_as_instruction fired ZERO times here and missed FIVE real positives that
# this stratum happens to contain, including the sixth bundle found whose
# operative instructions are not in it. Combined with its own census - 10/30
# precision with 3 misses - the term now has poor precision AND poor recall,
# measured on two independent strata.

# ── T13: instr_control ────────────────────────────────────────────────────────
#
# 40 bundles that trip none of the three rule shapes, drawn from probes 42x, 16x
# and 145x looser than the rules, so a bundle here COULD plausibly have fired and
# did not. This is where misses live.
#
# THE LARGEST FINDING OF THE PASS IS IN THIS STRATUM. Ten of these forty bundles
# direct the reader to add a hosted MCP endpoint as an MCP server in their client
# configuration. That is instruction.config_mutation by any reading, and the rule
# is silent on every one of them, for the structural reason already identified in
# its own stratum: the pattern wants the config noun immediately after the
# article, and this phrasing puts a URL in between.
#
# Nine of the ten are one integration template with the vendor name swapped.
# Measured across the whole corpus, that phrasing appears in 1915 of 34302
# bundles - 5.58%. The rule fires on 193 bundles in total. It is therefore
# missing roughly ten times more than it catches, from a single template.


