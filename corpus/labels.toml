# ── T13 phase 1: the census is complete, and it is a bad result ───────────────
#
# 36 bundles, 34 labelled, 2 too_large. 27 distinct entry texts among the 34, so
# the effective sample is smaller than the count and any interval here is
# optimistic.
#
# Measured against the shipped rule, over this stratum only:
#
#   instruction.fetch_as_instruction   precision 10/30 (33.3%)  fn 3
#
# Twenty false positives out of thirty firings. Not a marginal result and not
# one narrowing a regex will rescue on its own, because the misfires are three
# distinct genres:
#
#   - Security-review skills, seven of them across five distinct scanner bodies.
#     They match because enumerating these shapes is their job. One writes down
#     the exact distinction the pattern tier cannot make.
#   - Fetched code that is executed rather than fetched text that becomes
#     instructions. Eight bundles from ONE malware campaign wearing seven
#     product names - trading, proxy harvesting, social automation - all with a
#     password-protected archive whose password is printed beside it, or a
#     base64 one-liner that runs bash on the body of a plain-HTTP request to a
#     bare IP. Genuinely dangerous, and named by net.fetch_then_execute and
#     instruction.exec_directive rather than by this term.
#   - Prompt-convention prose. A terminal simulator saying to treat text in
#     braces as instruction, with no remote half at all.
#
# And it misses the clearest cases it should catch. Three false negatives, two
# of them a registry client that extracts another skill and says in as many
# words to follow the fetched instructions, and the third an entire language
# whose programs are fetched from arbitrary URLs and interpreted by the model.
#
# The other two terms CANNOT be scored from this stratum and their numbers here
# are not precision. This stratum was selected by the fetch probe, so a
# config_mutation or exfil true positive appearing in it was never sampled for.
# Their own 40-bundle strata are drawn and not yet labelled. What the misses do
# show is real: config_mutation stayed silent on ten bundles that direct an MCP
# registration, because its second pattern requires the noun to follow the
# article immediately and real prose puts a product name in between - add the
# Composio MCP server, ensure your MCP settings include. That is a fixable rule,
# on evidence, in phase 2.

# ── T13: instr_config_mutation ────────────────────────────────────────────────
#
# 40 bundles drawn from 178. Six are recorded too_large below and that is a
# BIASED loss worth stating rather than burying: setup, onboarding and
# memory-management skills are exactly the genre that both directs config edits
# and runs long, so the unreadable tail is enriched for the term being measured.
# The rate below therefore describes the readable 34.
#
# One bundle was rescued by measuring the budget over prose rather than over the
# whole bundle. All three terms here are markdown rules, so a bundle whose bulk
# is code is not expensive to judge for them.

