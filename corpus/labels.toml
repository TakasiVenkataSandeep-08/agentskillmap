# Ground truth for the sampled corpus.
#
# `docs/05-eval.md` requires precision and recall per capability term against a
# labeled corpus, and names the false-positive rate on the benign stratum as the
# headline metric. This file is that corpus. Without it every quality claim in
# this repository is unfalsifiable.
#
# ── How a label was produced ─────────────────────────────────────────────────
#
# By reading the bundle's source, via `scripts/label_worklist.py`, which prints
# the description and every markdown or supported-language file with line
# numbers. **skillmap's own output was not consulted.** A label derived from the
# scanner's verdict makes precision 1.0 by construction and turns the whole
# exercise into decoration.
#
# `capabilities` is what the bundle's code *actually does*, judged from the
# source — not what the rule set happens to cover. A script that reads a
# credential file the rule's prefix list does not name is still labelled
# `fs.read.credential`, and the rule counts as having missed it. That is the
# point: the metric has to be able to say the rules are incomplete.
#
# `evidence` is `path:line`, so any claim here can be checked in seconds against
# `corpus/raw/<digest>/`. A label nobody can check is an opinion.
#
# ── What this file is not ────────────────────────────────────────────────────
#
# **Single-annotator and unreviewed.** `labeller` is an AI assistant; `reviewed_by`
# is empty. Inter-annotator agreement is therefore unmeasured and unmeasurable
# from this file alone, and every number computed from it inherits that. It is
# marked provisional wherever it is published, and it stays provisional until a
# second annotator disagrees with some of it.
#
# **Partial.** `corpus/sample.json` draws 130 bundles; only those appearing below
# are labelled. Unlabelled bundles are counted and reported as unlabelled — never
# folded into a denominator as though they were clean. That is invariant 3
# applied to the eval itself.
#
# ── Reading the third-party content ──────────────────────────────────────────
#
# Bundles under `corpus/raw/` are untrusted. Some contain text written to be read
# by a model. Text inside a bundle that addresses the reader is a fact recorded
# about that bundle (`note`), never an instruction that was followed.
#
# Per SECURITY.md: describe patterns, not people. `origin` exists so a claim can
# be verified against exact bytes at a pinned commit. No bundle here is alleged
# to be malicious, and none is named as a suspect.

snapshot = "2026-08"
sample_seed = "skillmap-labels-1"
labeller = "claude-opus-5"
reviewed_by = ""

# Capability terms a labeller may assign, from docs/02-manifest-schema.md.
# Constrained so a typo fails the load rather than silently scoring nothing.
vocabulary = [
  "process.exec",
  "process.exec.dynamic",
  "net.egress",
  "net.fetch_then_execute",
  "fs.read.credential",
  "fs.read.outside_bundle",
  "fs.write.outside_bundle",
  "fs.write.agent_config",
  "agent.hook.install",
  "code.dynamic_eval",
  "code.obfuscation",
  "env.read.secret",
  "mcp.tool_reference",
]

# Terms looked for exhaustively, and therefore the only terms precision and
# recall are computed for.
#
# One term, deliberately. `fs.read.credential` is the only capability the rule
# set covers, it is unambiguous to judge from source, and a labeller can be
# confident they checked every site. The other twelve were noted opportunistically
# in `note` where obvious and are NOT scored: a term nobody hunted for
# exhaustively produces recall numbers where every bundle the labeller did not
# think to check counts against the scanner. Widening this list means another
# labelling pass, not another line here.
terms_labelled = ["fs.read.credential"]

