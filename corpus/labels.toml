# Reads `.env` through a **literal** path — `env_file = Path(".env")` — and then
# calls `env_file.read_text()` on a later line. The Python query has a pattern
# for `Path("...").read_text()` as a single expression; one variable assignment
# in between defeats it.
#
# So this is the same computed-path story as every other miss in the corpus, but
# with the weakest possible form of computation: a local variable holding a
# constant. Worth recording precisely, because it bounds how much a
# constant-folding pass would buy — a single assignment is the common case.
#
# It also appends the API key back into `.env` to persist it.
note = "Wraps agent calls in a policy engine. Reads .env for its API key through a local variable holding a literal path, appends the key back to .env to persist it, and writes a callguard.yaml policy file. AGENT_SENTINEL_API_KEY from the environment. Enforces budgets locally and makes no request of its own, despite the description advertising a hosted dashboard."

