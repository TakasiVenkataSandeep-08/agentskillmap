evidence = ["assets/templates/pre-deploy.sh:31"]
disclosure_delta = false
# CORRECTED. First labelled `capabilities = []` on the reading that the script
# only tests for .env's presence (`[ ! -f .env ]`). It also runs
# `grep -q "^${var}=" .env`, which reads the file's contents to check whether a
# variable is set. The scanner was right and the label was wrong.
#
# Left in the record rather than quietly amended: this is one labeller's error
# caught by a disagreement, on a sample of seven, and it is the most concrete
# evidence available that `reviewed_by` being empty is a real weakness rather
# than a formality.
note = "Deployment hook templates for a PaaS. pre-deploy.sh greps .env for required variable names, which reads it. Everything the templates do is described in the guide the skill points at."
