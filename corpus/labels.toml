# ── fence_control ────────────────────────────────────────────────────────────
#
# T10's control stratum: bundles with a shell fence and neither directive shape.
# These are the false positives the signal will actually face.
#
# **Basis of judgement, stated because it is narrower than the other strata.**
# Each was read for one question — does the prose direct retrieval of remote
# content and then execute it. The term's mechanism requires a fetch, so a
# bundle whose fences contain no retrieval at all cannot carry it, and that is
# sufficient evidence for absence. These bundles were NOT read exhaustively for
# the eight capability terms, which is why `strata_scored` excludes this
# stratum.
#
# **That basis was too narrow on the first pass and was corrected.** It read
# SKILL.md alone, while the instruction plane analyses every markdown file in
# the bundle. A re-scan across all eighty bundles and all their markdown found
# exactly one label wrong — a repository whose install directive lives in
# README.md and AGENTS.md rather than in SKILL.md. One in eighty is a small
# error rate and it was still an error; the re-scan is what turned it up, not
# the reading.
#
# The result is the useful part: **none of the forty carries the term.** Ten
# contain a retrieval of some kind — REST API calls, `git fetch`, a CLI
# subcommand spelled `fetch`, a bundled script taking a `fetch` argument — and
# in none of them is anything retrieved then executed. The draw's negative side
# has no missed positives on this sample.

