# A distinction this corpus needs and did not have a word for: **disclosed to the
# reviewer** is not **disclosed to the agent**.
#
# The description is "Generate CSS and Framer Motion animations from plain
# English. Use when you need smooth animations without the math." A reader could
# take that for a local template generator. The code instantiates an OpenAI
# client from OPENAI_API_KEY and calls the API.
#
# SKILL.md's *body* does say it, at line 67 of 79: "Needs OPENAI_API_KEY
# environment variable." So a reviewer who opens the file learns it. The agent,
# which sees only the ~100-token description at session start, does not.
#
# Both of the repository's definitions take the description as the baseline —
# docs/04-semantic-layer.md ("things the ~100-token description does not
# disclose") and the schema's `disclosure_delta` ("capability present in
# reference files but not implied by always content"). So: true. A stricter
# reading that counts anything in SKILL.md as disclosed scores it false, and the
# line number is recorded so that reading can be applied without re-reading the
# bundle.
note = "Generates animation CSS by calling a hosted model with a key from OPENAI_API_KEY, and writes one output file. The description mentions neither; SKILL.md's body names the key requirement at line 67."

