# The most significant taxonomy gap the pass has found, and it is not a rule gap.
#
# This bundle extracts the agent's own OAuth tokens from the operating system's
# credential store:
#
#   security find-generic-password -s "Claude Code-credentials" -w    (macOS)
#   secret-tool                                                        (Linux)
#
# then greps `accessToken` and `refreshToken` out of the result.
#
# `fs.read.credential` is labelled absent, and that is correct by the term's own
# definition — "reads a known credential path or secret-bearing env var". A
# keychain is neither a path nor an env var. **There is no term in the taxonomy
# for reading the OS credential store**, and no rule could report it if there
# were, because nothing in the manifest can describe it.
#
# That is arguably the most direct route to stealing an agent's own
# authentication, and skillmap currently has no vocabulary for it. Recorded in
# docs/00-tasks.md's Known gaps with this bundle as the example.
#
# Not a delta: the description says "Check Claude Code OAuth usage limits", and
# the body states plainly that it retrieves the token from the system keychain.
note = "Reads Claude Code's OAuth access and refresh tokens out of the macOS Keychain, or secret-tool on Linux, and queries the usage endpoint with them. Caches the result in /tmp. Both the description and the body say so. curl against api.anthropic.com; invokes sibling scripts through a computed $SCRIPT_DIR. The keychain read (security find-generic-password / secret-tool) still has no term to carry it."

