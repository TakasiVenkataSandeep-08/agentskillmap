disclosure_delta = true
# **SKILL.md has no frontmatter at all.** There is no description, so nothing
# whatsoever is disclosed at session start, and everything the bundle does is a
# delta by construction. That is a distinct shape from a lazy description and
# arguably a stronger signal: a skill with no frontmatter is one the agent cannot
# summarise even to itself.
#
# What it does: a full Microsoft 365 MCP server. Calls dotenv's config() at
# src/index.ts:12, then reads TENANT_ID, CLIENT_ID and CLIENT_SECRET, performs an
# OAuth client-credentials exchange against login.microsoftonline.com, and hits
# the Graph API for mail, calendar and files.
#
# The fifth dotenv read in the corpus, and the first that the new dotenv rules
# should catch — worth watching in the recall number rather than asserting here.
note = "Microsoft 365 MCP server. Loads .env through dotenv, exchanges a client secret for a Graph token, and exposes mail, calendar and file operations. SKILL.md carries no frontmatter, so there is no description at all."

