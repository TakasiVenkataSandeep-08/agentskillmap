# ── A clarification to the exfil definition, made when it first bit ───────────
#
# The definition fixed before the pass says "data of the user's ... something
# belonging to the user or their environment". Read at its widest that swallows
# registration: an email address typed into a signup call is the user's, so
# every skill that registers for an API key would be a positive and the term
# would mean nothing.
#
# The line, applied from here and checked backwards:
#
#   COUNTS - credentials, secrets, files, conversation content, source code,
#            recordings, telemetry, or anything else drawn FROM the user's
#            machine or their session and sent outward.
#   DOES NOT COUNT - identity the user supplies to open an account with a
#            service they are choosing to use: an email, a wallet address, a
#            signature, an agent name. That is the user transacting with a
#            service, not a skill moving their data off the machine.
#
# This is a refinement of an ambiguous clause rather than a new rule, and it was
# checked against every exfil label already recorded: conversation messages,
# observations drawn from private sessions, tool inputs and outputs, meeting
# recordings, installed skill source, workspace documents and triple-store
# contents all still count, and the one registration-only bundle already
# labelled negative stays negative. Nothing was overturned. Recorded here rather
# than applied silently, because a definition that moves during a pass and is
# not written down is how a measurement stops being reproducible.

