# Reference rule. Copy this shape when adding coverage — see docs/03-rules-authoring.md.
id         = "py.credential-read.dotfile"
language   = "python"
capability = "fs.read.credential"
tier       = "proven"
query      = "queries/python/credential-read.scm"

[captures]
site = "@site"   # reported as the evidence span — keep it minimal
path = "@path"   # lands in detail.paths when statically resolvable

# Data, not code. Extend this list to add coverage; no Rust change required.
[match]
path_prefixes = [
  "~/.aws/",
  "~/.ssh/",
  "~/.config/gh/",
  "~/.kube/config",
  "~/.docker/config.json",
  ".env",
  ".netrc",
]

[docs]
summary = "Reads a path conventionally holding credentials."
rationale = """
Entirely legitimate for skills that manage cloud or git configuration. Reported, never
judged — policy.toml decides whether this is acceptable for a given repo.
"""
false_positive_notes = """
Fires on skills that mention credential paths inside documentation strings or examples.
negative.py covers the documentation case. Extend the negative fixture rather than
narrowing the query — narrowing loses real detections.
"""
