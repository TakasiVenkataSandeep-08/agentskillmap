# Detects a python skill reading a secret-named environment variable.
#
# `env.read.secret` is 27 of 92 labelled bundles, second only to net.egress.
id         = "py.env-secret.read"
language   = "python"
capability = "env.read.secret"
tier       = "proven"
query      = "queries/python/env-secret.scm"

[captures]
site = "@site"

[docs]
summary = "Reads an environment variable whose name indicates a secret."
rationale = """
The normal way a skill gets an API key, and normal is the point: the manifest says
the key is read, and policy.toml decides whether that is acceptable here. It becomes
interesting next to a disclosure delta — a description that never mentions needing a
credential at all.
"""
false_positive_notes = """
The name regex is tuned against the corpus rather than invented: of every environment
read in the 92 labelled bundles, 28 of 28 secret-bearing names match and 0 of 38
non-secret names do. `CACHE_KEY`, `PRIMARY_KEY`, `SORT_KEY`, `MAX_TOKENS`,
`TOKENIZER`, `CLIENT_ID` and `TENANT_ID` are all held out, and a bare `_KEY$` is
absent because every cache and every database row has one.

Call forms only — `os.getenv(...)` and `os.environ.get(...)`. That is the write
guard, and it is structural rather than a predicate: there is no way to assign
through `.get()`, so no arrangement of the surrounding statement can make these
match a write. `os.environ["X"] = v` is an assignment to a subscript and would need
the subscript READ form to be matched too; tree-sitter cannot express "this
subscript is not an assignment target", and matching it anyway would report a write
that sets a credential as a read of one. The `.env` loaders that do exactly that are
in the corpus.

The cost is a real miss: `os.environ["OPENAI_API_KEY"]` as a read reports nothing.
It is the honest trade — a silent miss over a false claim about direction — and it
is the same call the shell redirect rule already made in the other direction, where
the grammar DID offer a way to tell `<` from `>`.
"""
