# Detects a typescript skill reading a secret-named environment variable.
#
# `env.read.secret` is 27 of 92 labelled bundles, second only to net.egress.
id         = "ts.env-secret.read"
language   = "typescript"
capability = "env.read.secret"
tier       = "proven"
query      = "queries/typescript/env-secret.scm"

[captures]
site = "@site"

[docs]
summary = "Reads an environment variable whose name indicates a secret."
rationale = """
The normal way a skill gets an API key. The manifest says the key is read;
policy.toml decides whether that is acceptable. It becomes interesting next to a
disclosure delta — a description that never mentions needing a credential at all.
"""
false_positive_notes = """
The name regex is tuned against the corpus rather than invented: of every environment
read in the 92 labelled bundles, 28 of 28 secret-bearing names match and 0 of 38
non-secret names do. `CACHE_KEY`, `PRIMARY_KEY`, `MAX_TOKENS`, `TOKENIZER`,
`CLIENT_ID` and `TENANT_ID` are held out, and a bare `_KEY$` is absent because every
cache and every database row has one.

Every pattern anchors on a READ context — a declarator value, an object-literal value,
an argument, an operand, a return, a template substitution. That is the write guard.
`process.env.X = v` is the same node in an assignment's left field and tree-sitter has
no negation, so the alternative was matching it anyway and reporting a hand-rolled
dotenv loader — which SETS credentials — as a reader of them. Two bundles in the
corpus write the environment exactly that way, and this repository has already shipped
that error once in the other plane, where `cat > .env` was reported as a read.

The cost is that a read in a context not enumerated here is missed. The list covers
every shape the labelled corpus uses, which is not the same as every shape.
"""
