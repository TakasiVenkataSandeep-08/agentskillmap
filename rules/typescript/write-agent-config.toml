# Detects a typescript skill writing another agent's configuration.
id         = "ts.write-agent-config.sink"
language   = "typescript"
capability = "fs.write.agent_config"
tier       = "proven"
query      = "queries/javascript/file-write.scm"

[captures]
site    = "@site"
path    = "@path"
dynamic = "@dynamic"

# Agent configuration is a credential store and an instruction store in this
# ecosystem: a skill that writes `CLAUDE.md` or `.mcp.json` is changing what
# every later session does.
[match]
path_suffixes = [
  "CLAUDE.md",
  "AGENTS.md",
  "settings.json",
  "settings.local.json",
  ".mcp.json",
]
path_contains = [
  ".claude",
  ".cursor",
  ".codex",
]

[docs]
summary = "Writes a file that configures an agent."
rationale = """
A skill that installs itself into an agent's configuration changes what that agent
does in every later session, including sessions the installing user never sees.
Legitimate for setup scripts, which is most of what this will report. Reported,
never judged.
"""
false_positive_notes = """
Matches by filename and by containing directory, so a project's own `CLAUDE.md` is
reported as readily as another agent's. That is intended — the manifest describes
the act, and whether writing agent config is acceptable is what policy.toml is for.

There is no read counterpart. Reading agent config to harvest the keys inside it is
the more direct attack and the taxonomy has no term for it; that gap is recorded in
docs/00-tasks.md rather than papered over by widening this term.
"""
