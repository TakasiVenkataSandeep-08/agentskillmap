# Ported from the reference rule in rules/python/. The corpus put typescript in the
# top four languages by usage, which is why this one exists and others do not.
id         = "ts.credential-read.dotfile"
language   = "typescript"
capability = "fs.read.credential"
tier       = "proven"
query      = "queries/typescript/credential-read.scm"

[captures]
site    = "@site"
path    = "@path"
dynamic = "@dynamic"

[match]
path_prefixes = [
  "~/.aws/",
  "~/.ssh/",
  "~/.config/gh/",
  "~/.kube/config",
  "~/.docker/config.json",
  ".env",
  ".netrc",
]

[docs]
summary = "Reads a path conventionally holding credentials."
rationale = """
Legitimate for skills that manage cloud or git configuration. Reported, never
judged — policy.toml decides whether this is acceptable for a given repo.
"""
false_positive_notes = """
Same shape as the JavaScript rule, and the same false positives: a credential
path named in a type, comment, or constant without being read.
"""
