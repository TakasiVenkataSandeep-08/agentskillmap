# Ported from the reference rule in rules/python/. The corpus put shell in the
# top four languages by usage, which is why this one exists and others do not.
id         = "sh.credential-read.dotfile"
language   = "shell"
capability = "fs.read.credential"
tier       = "proven"
query      = "queries/shell/credential-read.scm"

[captures]
site    = "@site"
path    = "@path"
dynamic = "@dynamic"

[match]
path_prefixes = [
  "~/.aws/",
  "~/.ssh/",
  "~/.config/",
  "~/.kube/config",
  "~/.docker/config.json",
  ".env",
  ".netrc",
]

# Filenames that identify a credential wherever they live. Matched at a component
# boundary against a path the engine resolved only partially — see `fold` in
# skillmap-code.
#
# Separate from `path_prefixes` because they answer different questions.
# `~/.aws/` asks "is this the file at this location"; `.env` asks "is this a file
# with this name". Every credential read in the 2026-08 labelled corpus computes
# its path, so the location is often unknowable and the name is not.
#
# Deliberately short. Each of these is a filename whose only conventional purpose
# is holding secrets; `config.json` and `settings.json` are not here, because most
# of them hold no secret and the false positives would land on the benign stratum
# this project measures itself by.
path_suffixes = [
  ".env",
  ".netrc",
  "credentials.json",
  "credentials",
  ".token",
]

# Directory names that identify a credential store regardless of what is filed
# inside it. The third matching mode, and the one the other two cannot reach:
# `~/.clawdbot/credentials/homebridge.json` is named per-integration, so no list
# of filenames reaches it, and it starts with a home directory no prefix list
# should claim. What is knowable is the directory.
#
# Matched at component boundaries on both sides, so `my-credentials/` does not
# match. See `contains_component` in skillmap-code.
path_contains = [
  "credentials",
]


[docs]
summary = "Reads a path conventionally holding credentials."
rationale = """
Legitimate for skills that manage cloud or git configuration. Reported, never
judged — policy.toml decides whether this is acceptable for a given repo.
"""
false_positive_notes = """
Fires on scripts that echo or document credential paths rather than reading
them. The negative fixture covers the documentation case; extend it rather than
narrowing the query, because narrowing loses real detections.
"""
