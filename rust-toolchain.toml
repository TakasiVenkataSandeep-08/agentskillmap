[toolchain]
# Pin an exact stable Rust version to guarantee byte-identical builds.
# An unpinned toolchain (e.g. "stable") compiles with a different version
# on different CI runs and machines, breaking invariant 2's determinism promise.
# Reproducible builds are non-negotiable for a supply-chain auditor.
#
# Moved 1.85.0 -> 1.97.1 in T3: the corpus harvester's HTTP client pulls
# url -> idna -> icu_*, which require 1.86 or newer. The pin's job is to be
# exact, not to be old.
channel = "1.97.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
